name: Remove obsolete FFmpeg-containing MSIX test artifact

# One-time safety action: exact artifact ID/name/run/size are checked before deletion.
# Remove this temporary workflow after the public API confirms the artifact is gone.
on:
  push:
    branches: [main]

jobs:
  cleanup:
    if: ${{ contains(github.event.head_commit.message, '[cleanup-legacy-msix]') && github.repository == '32ethers/SlimClip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Verify exact old MSIX artifact then delete it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/actions/artifacts/11945350355"
          response=$(curl --fail-with-body -sS -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" "${api}" -w '\n%{http_code}' || true)
          status="${response##*$'\n'}"
          if [ "$status" = 404 ]; then
            echo '::notice::Old MSIX artifact has already been deleted.'
            exit 0
          fi
          if [ "$status" != 200 ]; then
            echo "::error::Artifact metadata GET returned HTTP ${status}; not deleting anything."
            exit 1
          fi
          body="${response%$'\n'*}"
          metadata=$(printf '%s' "$body" | python3 -c 'import json,sys; a=json.load(sys.stdin); print("{}|{}|{}".format(a["name"],a["workflow_run"]["id"],a["size_in_bytes"]))')
          if [ "$metadata" != 'SlimClip-PRIVATE-TEST-SIGNED-TRUST-CERT-FIRST|38672137007|143149766' ]; then
            echo '::error::Artifact identity/run/size changed; refusing deletion.'
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" "${api}")
          if [ "$code" != 204 ] && [ "$code" != 404 ]; then
            echo "::error::Artifact DELETE returned HTTP ${code}."
            exit 1
          fi
          echo '::notice::Removed the exact obsolete GPL FFmpeg MSIX artifact 11945350355.'
