name: Windows classic-menu EXE installer

# FFmpeg is downloaded solely for disposable CI media tests. The public installer
# contains only MIT SlimClip code and the Inno Setup runtime, never FFmpeg binaries.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FFMPEG_URL: https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip
  FFMPEG_SHA256: db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec

permissions:
  contents: read

concurrency:
  group: slimclip-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download pinned FFmpeg solely for engine tests
        id: ffmpeg
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FFMPEG_URL -notmatch '^https://[^\s]+$' -or $env:FFMPEG_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid pinned FFmpeg source' }
          $work = Join-Path $env:RUNNER_TEMP 'SlimClip-test-only-FFmpeg'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $archive = Join-Path $work 'ffmpeg.zip'
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ine $env:FFMPEG_SHA256) { throw "FFmpeg test ZIP hash mismatch: $actual" }
          $expanded = Join-Path $work 'expanded'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $binary = @(Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter 'ffmpeg.exe')
          if ($binary.Count -ne 1) { throw 'ZIP must have exactly one ffmpeg.exe' }
          $binDir = $binary[0].DirectoryName
          if (-not (Test-Path -LiteralPath (Join-Path $binDir 'ffprobe.exe') -PathType Leaf)) { throw 'ffprobe.exe must be beside ffmpeg.exe' }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "bin_dir=$binDir`n", $utf8)

      - name: Smoke-test H.265 and audio streams with test-only FFmpeg
        id: smoke
        env:
          FFMPEG_DIR: ${{ steps.ffmpeg.outputs.bin_dir }}
        run: |
          $env:PATH = "$env:FFMPEG_DIR;$env:PATH"
          & .\tests\ffmpeg-smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg smoke tests failed' }

      - name: Run .NET video-engine integration tests
        id: engine
        env:
          SLIMCLIP_FFMPEG_DIR: ${{ steps.ffmpeg.outputs.bin_dir }}
        run: |
          dotnet run --project tests/SlimClip.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Video-engine integration tests failed' }

      - name: Verify first-use upstream FFmpeg download and extraction
        id: download
        run: |
          dotnet run --project tests/SlimClip.Tests.csproj --configuration Release -- --upstream-download-smoke
          if ($LASTEXITCODE -ne 0) { throw 'First-use FFmpeg acquisition failed' }

      - name: Locate or install Inno Setup compiler on disposable runner
        id: inno
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = $null
          foreach ($base in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
            if (-not $base) { continue }
            $candidate = Join-Path $base 'Inno Setup 6\ISCC.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) { $iscc = $candidate; break }
          }
          if (-not $iscc) {
            $existing = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($existing) { $iscc = $existing.Source }
          }
          if (-not $iscc) {
            choco install innosetup --version=6.6.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 6.6.1 installation failed' }
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'Inno Setup ISCC.exe not found' }
          Write-Host ('Using Inno Setup compiler: ' + $iscc + ' (' + (Get-Item -LiteralPath $iscc).VersionInfo.FileVersion + ')')

      - name: Build FFmpeg-free classic-menu EXE installer
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'VS toolchain unavailable on runner' }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'No x64 C++ toolchain on runner' }
          $developerCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $developerCmd)) { throw 'VsDevCmd.bat unavailable' }
          $build = Join-Path $env:GITHUB_WORKSPACE 'packaging\build-exe.ps1'
          $version = '1.0.' + $env:GITHUB_RUN_NUMBER
          $command = 'call "{0}" -arch=x64 -host_arch=x64 && powershell.exe -NoProfile -ExecutionPolicy Bypass -File "{1}" -Version "{2}"' -f $developerCmd, $build, $version
          $log = Join-Path $env:RUNNER_TEMP 'SlimClip-exe-build.log'
          & cmd.exe /d /s /c ($command + ' 1> "' + $log + '" 2>&1')
          $exit = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $log)) { throw "Build command created no log; exit code: $exit" }
          $tail = @(Get-Content -LiteralPath $log -Tail 80)
          $tail | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) {
            foreach ($line in @($tail | Select-Object -Last 15)) {
              if (-not $line.Trim()) { continue }
              $safe = $line -replace '[%\r\n]', ' '
              Write-Host ('::error::' + $safe.Substring(0, [Math]::Min(400, $safe.Length)))
            }
            throw 'EXE installer build failed; see final build-line annotations.'
          }

      # No certificates or administrator trust changes. An actual Windows 11
      # File Explorer visual test must still be done on a Windows 11 client PC.
      - name: Install and uninstall classic-menu EXE on disposable runner
        id: install
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'SlimClip-exe-install.log'
          try {
            & .\tests\exe-install-smoke.ps1 -InstallerPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\SlimClip-Setup.exe') *>&1 | Tee-Object -FilePath $log
          } catch {
            $detail = ($_ | Out-String) -replace '[%\r\n]', ' '
            Write-Host ('::error::EXE install/uninstall: ' + $detail.Substring(0, [Math]::Min(800, $detail.Length)))
            throw
          }

      - name: Upload FFmpeg-free unsigned EXE installer
        id: installer
        uses: actions/upload-artifact@v4
        with:
          name: SlimClip-EXE-Installer-NO-FFMPEG
          path: artifacts/SlimClip-Setup.exe
          if-no-files-found: error
          retention-days: 7

      # The build job has only read permissions, even while it executes upstream
      # FFmpeg binaries. The report is deliberately tiny and excludes secrets.
      - name: Summarize redacted CI results
        if: ${{ always() && github.event.repository.private == true }}
        env:
          STEP_FFMPEG: ${{ steps.ffmpeg.outcome }}
          STEP_SMOKE: ${{ steps.smoke.outcome }}
          STEP_ENGINE: ${{ steps.engine.outcome }}
          STEP_DOWNLOAD: ${{ steps.download.outcome }}
          STEP_INNO: ${{ steps.inno.outcome }}
          STEP_PACKAGE: ${{ steps.package.outcome }}
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_INSTALLER: ${{ steps.installer.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'SlimClip-ci-diagnostics'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          # Persist only strict diagnostics, never arbitrary log lines or file paths.
          $diagnostics = [ordered]@{}
          foreach ($name in @('build','install')) {
            $path = Join-Path $env:RUNNER_TEMP ('SlimClip-exe-' + $name + '.log')
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $text = (Get-Content -LiteralPath $path -Tail 80) -join "`n"
            $diagnostics[$name] = [ordered]@{
              compiler_codes = @([regex]::Matches($text, '(?i)\b(?:CS|C|LNK|MSB)\d{4}\b') |
                ForEach-Object { $_.Value.ToUpperInvariant() } | Sort-Object -Unique | Select-Object -First 12)
              powershell_error_ids = @([regex]::Matches($text, '(?m)FullyQualifiedErrorId\s*:\s*([A-Za-z][A-Za-z0-9_.-]{0,80})') |
                ForEach-Object { $_.Groups[1].Value } |
                Where-Object { $_ -in @('ParameterArgumentValidationErrorEmptyStringNotAllowed','NativeCommandError','CommandNotFoundException','OperationStopped','InvalidData','ScriptHalted','ResourceUnavailable') } |
                Sort-Object -Unique | Select-Object -First 8)
              exit_codes = @([regex]::Matches($text, '(?i)\bexit code\s*[:=]?\s*(\d{1,5})\b') |
                ForEach-Object { [int]$_.Groups[1].Value } | Sort-Object -Unique | Select-Object -First 8)
            }
          }
          $summary = [ordered]@{
            run = $env:GITHUB_RUN_ID; commit = $env:GITHUB_SHA
            steps = [ordered]@{
              ffmpeg = $env:STEP_FFMPEG; smoke = $env:STEP_SMOKE; engine = $env:STEP_ENGINE
              download = $env:STEP_DOWNLOAD
              inno = $env:STEP_INNO; package = $env:STEP_PACKAGE
              install = $env:STEP_INSTALL; installer = $env:STEP_INSTALLER
            }
            diagnostics = $diagnostics
          }
          $summary | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $directory 'status.json') -Encoding UTF8

      - name: Transfer sanitized CI report to the reporter job
        if: ${{ always() && github.event.repository.private == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/SlimClip-ci-diagnostics/status.json
          if-no-files-found: error
          retention-days: 3

  # Separate job is the only place with repository write access. No FFmpeg
  # executable is ever run here. Its branch does not trigger the main CI workflow.
  report:
    needs: build
    if: ${{ always() && github.event.repository.private == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: retrieve
        continue-on-error: true
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: ci-report
      - name: Prepare fallback status if diagnostics artifact is unavailable
        if: ${{ always() }}
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ci-report/status.json ]; then
            mkdir -p ci-report
            printf '{"run":"%s","commit":"%s","build_job":"%s","diagnostics":"artifact-unavailable"}\n' \
              '${{ github.run_id }}' '${{ github.sha }}' "$BUILD_RESULT" > ci-report/status.json
            echo '::warning::CI diagnostics artifact unavailable; publishing only job result.'
          fi
      - name: Push structured status to private ci-diagnostics branch
        shell: bash
        run: |
          set -euo pipefail
          blob=$(git hash-object -w ci-report/status.json)
          tree=$(printf '100644 blob %s\tstatus.json\n' "$blob" | git mktree)
          parent=$(git ls-remote origin refs/heads/ci-diagnostics | awk '{print $1}')
          if [ -n "$parent" ]; then
            git fetch --quiet origin refs/heads/ci-diagnostics
            git cat-file -e "$parent^{commit}"
            commit=$(git -c user.name='SlimClip CI' -c user.email='ci@users.noreply.github.com' commit-tree "$tree" -p "$parent" -m "CI report ${{ github.run_id }}")
          else
            commit=$(git -c user.name='SlimClip CI' -c user.email='ci@users.noreply.github.com' commit-tree "$tree" -m "CI report ${{ github.run_id }}")
          fi
          git push origin "$commit:refs/heads/ci-diagnostics"
