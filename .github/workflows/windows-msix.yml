name: Windows 11 MSIX test build

# Pin a versioned upstream FFmpeg archive + upstream SHA-256. Updating the
# binary requires an explicit source review and commit. No build uploads
# GPL FFmpeg-containing binaries until Corresponding Source is verified.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FFMPEG_URL: https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip
  FFMPEG_SHA256: db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec

permissions:
  contents: read

concurrency:
  group: slimclip-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download and verify FFmpeg archive
        id: ffmpeg
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:FFMPEG_URL -notmatch '^https://[^\s]+$') { throw 'FFmpeg URL must be a single HTTPS URL' }
          if ($env:FFMPEG_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Provide a 64-digit SHA-256' }
          $work = Join-Path $env:RUNNER_TEMP 'SlimClip-FFmpeg-input'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $archive = Join-Path $work 'ffmpeg.zip'
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ine $env:FFMPEG_SHA256) { throw "FFmpeg ZIP hash mismatch: $actual" }
          $expanded = Join-Path $work 'expanded'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $binary = @(Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter 'ffmpeg.exe')
          if ($binary.Count -ne 1) { throw 'ZIP must have exactly one ffmpeg.exe' }
          $binDir = $binary[0].DirectoryName
          if (-not (Test-Path -LiteralPath (Join-Path $binDir 'ffprobe.exe') -PathType Leaf)) { throw 'ffprobe.exe must be beside ffmpeg.exe' }
          # Include upstream notices, not merely a sentence claiming compliance.
          $notices = @(Get-ChildItem -LiteralPath $expanded -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|NOTICE|README)' })
          if (-not @($notices | Where-Object { $_.Name -match '^(LICENSE|COPYING|NOTICE)' }).Count) {
            throw 'The binary archive lacks license/COPYING/NOTICE files; use a complete distribution'
          }
          $licenseDir = Join-Path $work 'license-notices'
          New-Item -ItemType Directory -Path $licenseDir | Out-Null
          foreach ($notice in $notices) {
            $relative = $notice.FullName.Substring($expanded.Length).TrimStart('\')
            $destination = Join-Path $licenseDir $relative
            New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
            Copy-Item -LiteralPath $notice.FullName -Destination $destination
          }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "bin_dir=$binDir`nlicense_dir=$licenseDir`n", $utf8)

      - name: Smoke-test FFmpeg audio and H.265 conversion
        env:
          FFMPEG_DIR: ${{ steps.ffmpeg.outputs.bin_dir }}
        run: |
          $env:PATH = "$env:FFMPEG_DIR;$env:PATH"
          & .\tests\ffmpeg-smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg smoke test failed' }

      - name: Run .NET video-engine integration tests
        env:
          SLIMCLIP_FFMPEG_DIR: ${{ steps.ffmpeg.outputs.bin_dir }}
        run: |
          dotnet run --project tests/SlimClip.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'SlimClip .NET integration tests failed' }

      - name: Build full MSIX and self-signed test package
        env:
          FFMPEG_DIR: ${{ steps.ffmpeg.outputs.bin_dir }}
          FFMPEG_LICENSE_DIR: ${{ steps.ffmpeg.outputs.license_dir }}
        run: |
          trap {
            $safeError = $_.Exception.Message -replace '[%\r\n]', ' '
            Write-Host ('::error::Build step exception: ' + $safeError.Substring(0, [Math]::Min(500, $safeError.Length)))
            break
          }
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'Visual Studio build tools unavailable on runner' }
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'No x64 C++ toolchain on runner' }
          $developerCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $developerCmd)) { throw 'VsDevCmd.bat unavailable' }
          $version = '1.0.' + $env:GITHUB_RUN_NUMBER + '.0'
          # Sign only on this disposable runner. The private key stays local;
          # neither the MSIX nor its certificate is uploaded to the public repository.
          $signing = 'Test'
          # cmd.exe imports the MSVC and Windows SDK environment for build.ps1.
          $build = Join-Path $env:GITHUB_WORKSPACE 'build.ps1'
          $command = 'call "{0}" -arch=x64 -host_arch=x64 && powershell.exe -NoProfile -ExecutionPolicy Bypass -File "{1}" -FFmpegDir "{2}" -FFmpegLicenseDir "{3}" -PackageVersion "{4}" -Signing "{5}"' -f $developerCmd, $build, $env:FFMPEG_DIR, $env:FFMPEG_LICENSE_DIR, $version, $signing
          $log = Join-Path $env:RUNNER_TEMP 'SlimClip-build.log'
          $redirected = $command + ' 1> "' + $log + '" 2>&1'
          & cmd.exe /d /s /c $redirected
          $buildExit = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $log)) { throw "Build command created no log; cmd exit code: $buildExit" }
          $tail = @(Get-Content -LiteralPath $log -Tail 80)
          $tail | ForEach-Object { Write-Host $_ }
          if ($buildExit -ne 0) {
            # Mark the final build lines as check annotations even if the failure
            # message does not contain an English word such as 'error'.
            foreach ($line in @($tail | Select-Object -Last 15)) {
              if (-not $line.Trim()) { continue }
              $safe = $line -replace '[%\r\n]', ' '
              Write-Host ('::error::' + $safe.Substring(0, [Math]::Min(400, $safe.Length)))
            }
            throw 'Full MSIX build failed; see final build-line annotations above.'
          }

      # This Windows Server runner can exercise the MSIX deployment APIs, but
      # cannot demonstrate the Windows 11 Explorer menu UI. Push builds never upload packages.
      - name: Install and uninstall signed MSIX on disposable runner
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & .\tests\msix-install-smoke.ps1 -PackagePath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\SlimClip.test.msix') -CertificatePath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\SlimClip.test.cer')
          } catch {
            $detail = ($_ | Out-String) -replace '[%\r\n]', ' '
            Write-Host ('::error::Install/uninstall: ' + $detail.Substring(0, [Math]::Min(800, $detail.Length)))
            throw
          }

      # Only an explicit manual run in a PRIVATE repository may upload the GPLv3
      # FFmpeg-containing package. Never upload a private key or a public-repo binary.
      - name: Upload PRIVATE test-signed MSIX and public certificate
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == true && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: SlimClip-PRIVATE-TEST-SIGNED-TRUST-CERT-FIRST
          path: |
            artifacts/SlimClip.test.msix
            artifacts/SlimClip.test.cer
          if-no-files-found: error
          retention-days: 3

      - name: Explain skipped upload in public repository
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private != true }}
        run: Write-Host '::notice::Public repository: test MSIX containing FFmpeg is deliberately not uploaded.'
